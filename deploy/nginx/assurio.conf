# Assurio reverse proxy.
#   /            -> Next.js  (127.0.0.1:3000)
#   /api/        -> NestJS   (127.0.0.1:3001)
#
# Nothing else is exposed. OpenWA's dashboard (2785), Postgres (5435),
# Redis (6379) and ClamAV (3310) stay bound to loopback — reach them over an
# SSH tunnel, never through nginx.
#
# certbot --nginx -d your-domain.com   rewrites this for TLS.
server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 12M;   # ID uploads are capped at 10 MB

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Report PDFs render synchronously on a cold cache.
        proxy_read_timeout 120s;
        # SSE (subject live updates) must not be buffered.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
